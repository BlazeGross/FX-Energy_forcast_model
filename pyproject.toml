[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-energy-forecast"
version = "0.1.0"
description = "EUR/PLN and TTF forecasting with rolling-origin evaluation"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "statsmodels>=0.14.4,<0.15",
    "arch>=7.2,<9",
    "xgboost>=2.1,<4",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.57,<2",
    "plotly>=6,<7",
    "yfinance>=0.2.65,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["fx_energy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
